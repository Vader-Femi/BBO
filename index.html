<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBE BBO Interactive Question Bank</title>
    <style>
        :root {
            --primary: #004d99;
            --secondary: #0066cc;
            --bg-color: #f0f4f8;
            --text-main: #333;
            --text-muted: #555;
            --border-radius: 8px;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex;
            height: 100vh;
            overflow: hidden; /* Prevent body scroll, let content area scroll */
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: #fff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0; /* Prevents sidebar from shrinking */
        }

        .sidebar h2 {
            text-align: center;
            color: var(--primary);
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #eee;
            font-size: 1.2em;
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 15px 20px;
            text-align: left;
            font-size: 1em;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 1px solid #f4f4f4;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #e6f0ff;
            color: var(--primary);
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: #fff;
            font-weight: bold;
        }

        /* Main Content Styles */
        .content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            scroll-behavior: smooth; /* Enables smooth scrolling on click */
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
        }

        /* Module Sections now display as a continuous list */
        .module-section {
            margin-bottom: 60px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
        }

        .module-section:first-of-type {
            border-top: none; /* Removes line above the first module */
            padding-top: 0;
        }

        .module-section h2 {
            color: var(--primary);
            margin-bottom: 25px;
        }

        .qa-container { 
            background: #fff; 
            padding: 25px; 
            margin-bottom: 20px; 
            border-radius: var(--border-radius); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            border-left: 5px solid var(--secondary); 
        }

        .case-study { 
            border-left: 5px solid #b8860b; 
        }

        .question { 
            font-weight: 600; 
            color: var(--primary); 
            margin-bottom: 15px; 
            font-size: 1.15em; 
        }

        .case-study .question {
            color: #b8860b;
        }

        .answer { 
            color: var(--text-muted); 
            line-height: 1.6; 
        }

        ul {
            margin-top: 10px;
            margin-bottom: 10px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        /* --- Mobile Optimization --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                scrollbar-width: none; 
            }
            
            .sidebar::-webkit-scrollbar {
                display: none; 
            }

            .sidebar h2 {
                display: none; 
            }

            .nav-btn {
                white-space: nowrap; 
                border-bottom: none;
                border-right: 1px solid #f4f4f4;
                padding: 12px 16px;
                font-size: 0.95em;
            }

            .content {
                padding: 20px 15px;
            }

            .qa-container {
                padding: 15px;
                margin-bottom: 15px;
            }
            
            .question {
                font-size: 1.05em;
            }
            
            ul {
                padding-left: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>SBE BBO Modules</h2>
        <button class="nav-btn active" data-target="mod1">Module 1: The Business of Banking</button>
        <button class="nav-btn" data-target="mod2">Module 2: Customer Service</button>
        <button class="nav-btn" data-target="mod3">Module 3: Cash & Teller</button>
        <button class="nav-btn" data-target="mod4">Module 4: Clearing Operations</button>
        <button class="nav-btn" data-target="mod5">Module 5: Treasury Operations</button>
        <button class="nav-btn" data-target="mod6">Module 6: Funds Transfer</button>
        <button class="nav-btn" data-target="mod7">Module 7: Electronic Banking</button>
        <button class="nav-btn" data-target="mod8">Module 8: Foreign Operations</button>
        <button class="nav-btn" data-target="cases">Case Studies</button>
    </div>

    <!-- Main Content Area -->
    <div class="content" id="scroll-container">
        <div class="header">
            <h1>Comprehensive Question Bank</h1>
            <p>Scroll down to browse all modules or use the sidebar to jump to a specific section.</p>
        </div>
        
        <!-- Modules will be dynamically injected here by Javascript -->
        <div id="module-container"></div>
    </div>

    <!-- Import the Data File -->
    <script src="questions.js"></script>
    
    <!-- Render and Scroll Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('module-container');
            const scrollContainer = document.getElementById('scroll-container');
            const navButtons = document.querySelectorAll('.nav-btn');

            // 1. Build the HTML dynamically from questions.js
            bankModules.forEach(module => {
                // Create section wrapper
                const section = document.createElement('div');
                section.id = module.id;
                section.className = 'module-section';
                
                // Add Module Title
                const title = document.createElement('h2');
                title.innerText = module.title;
                section.appendChild(title);

                // Add Questions
                module.questions.forEach(item => {
                    const qaDiv = document.createElement('div');
                    qaDiv.className = `qa-container ${module.isCaseStudy ? 'case-study' : ''}`;
                    
                    qaDiv.innerHTML = `
                        <div class="question">${item.q}</div>
                        <div class="answer">${item.a}</div>
                    `;
                    section.appendChild(qaDiv);
                });

                container.appendChild(section);
            });

            // 2. Click Navigation (Smooth scroll to section)
            navButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetId = e.target.getAttribute('data-target');
                    const targetSection = document.getElementById(targetId);
                    
                    // Remove active class from all buttons, add to clicked
                    navButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    // Scroll to the target section
                    targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            // 3. Scroll Spying (Update sidebar based on scroll position)
            const observerOptions = {
                root: scrollContainer,
                rootMargin: '0px 0px -60% 0px', // Triggers when the top of the module hits the top 40% of the screen
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const activeId = entry.target.id;
                        
                        // Update active state on sidebar
                        navButtons.forEach(btn => {
                            if (btn.getAttribute('data-target') === activeId) {
                                btn.classList.add('active');
                                // Ensure the active button is visible in the sidebar on mobile
                                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                            } else {
                                btn.classList.remove('active');
                            }
                        });
                    }
                });
            }, observerOptions);

            // Attach observer to each generated section
            document.querySelectorAll('.module-section').forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
